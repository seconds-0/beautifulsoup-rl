# Ablation: Small Model (1B instead of 4B)
#
# Purpose: Test if GPU memory pressure is causing the hang
# Hypothesis: If 1B survives longer, the fix added GPU memory overhead
#
# Changes from production config:
# - model = Llama-3.2-1B (4x smaller than Qwen3-4B)
# - max_steps = 50 (short run)

model = "meta-llama/Llama-3.2-1B-Instruct"
max_steps = 50                # Short run, just need to survive
batch_size = 32               # Same as production
rollouts_per_example = 4      # Same as production
trajectory_strategy = "interleaved"
max_async_level = 1           # Same as production (0 not allowed)
oversampling_factor = 1.0     # Same as production

[sampling]
max_tokens = 4096

[[env]]
id = "seconds-0/beautiful-soup-env"
args = { split = "train", mode = "all", cpu_cores = 2, memory_gb = 32 }

[env.log]
level = "info"
vf_level = "info"

[wandb]
project = "beautifulsoup-rl"
name = "ablation-llama-1b-small"

[wandb.log_extras]
samples = true
distributions = true
interval = 1
