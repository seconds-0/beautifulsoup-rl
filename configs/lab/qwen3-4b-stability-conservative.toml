# Qwen3-4B Stability Test: Conservative
#
# Hypothesis: Aggressive updates cause collapse
# Strategy: 8x reduction in rollouts per step (2048 → 256)
#
# Changes from production:
# - batch_size: 128 → 64
# - rollouts_per_example: 8 → 4
# - oversampling_factor: 2.0 → 1.0

model = "Qwen/Qwen3-4B-Instruct-2507"
max_steps = 100
batch_size = 64
rollouts_per_example = 4
trajectory_strategy = "interleaved"
max_async_level = 2
oversampling_factor = 1.0

[sampling]
max_tokens = 4096

[[env]]
id = "seconds-0/beautiful-soup-env"
args = { split = "train", mode = "bootstrap", cpu_cores = 2, memory_gb = 8 }

[env.log]
level = "info"
vf_level = "info"
